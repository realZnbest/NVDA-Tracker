name: Alert check

# Free alternative to a paid Render Cron Job: pings the deployed app's own
# /api/alerts/check endpoint on a schedule, independent of whether anyone has
# a browser tab open. Requires two repository secrets (Settings → Secrets and
# variables → Actions → New repository secret):
#   APP_URL      e.g. https://nvda-tracker.onrender.com  (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET env var set on Render

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert check
        run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/alerts/check" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
