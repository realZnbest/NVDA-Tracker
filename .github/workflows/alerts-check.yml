name: Alert checks

# GitHub Actions is the scheduler here because Vercel Hobby only allows one cron run per
# day. Ten-minute checks are enough for threshold/indicator alerts; GitHub's schedule is
# best-effort, so treat the interval as "roughly every 10 minutes".
#
# 13:00–22:59 UTC covers both US DST states: the regular session opens at 13:30 UTC in
# summer and 14:30 UTC in winter, and closes at 20:00/21:00 UTC respectively.
on:
  schedule:
    - cron: "*/10 13-22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: alert-checks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert evaluation
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          : "${APP_BASE_URL:?APP_BASE_URL secret is not set}"
          : "${CRON_SECRET:?CRON_SECRET secret is not set}"

          # Do not follow redirects. Vercel Deployment Protection answers
          # unauthenticated requests with a 302 to its SSO page, and curl
          # treats 3xx as success. Check the status explicitly instead.
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          if ! status="$(curl -sS -o "$response" -w '%{http_code}' \
               --retry 2 --retry-delay 20 --retry-all-errors \
               --max-time 120 \
               -X POST "${APP_BASE_URL%/}/api/alerts/check" \
               -H "Authorization: Bearer ${CRON_SECRET}")"; then
            echo "Request failed before receiving an HTTP response"
            cat "$response" || true
            exit 1
          fi

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Request failed with HTTP ${status}"
            cat "$response" || true
            exit 1
          fi

          cat "$response"
