name: Daily after-market summary

# 23:00 UTC = 06:00 Thailand time (ICT is UTC+7 year-round, no DST — so this one fixed
# expression is correct in both US DST states, and 23:00 UTC is always after the US close
# at 20:00 UTC in summer / 21:00 UTC in winter). Mon-Fri UTC fires land on Tue-Sat
# mornings in Bangkok, covering each Mon-Fri US session.
#
# Note: GitHub's scheduled runs are best-effort and can be delayed by several minutes
# under load — treat 06:00 as "roughly", not a guarantee.
on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily summary email
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          : "${APP_BASE_URL:?APP_BASE_URL secret is not set}"
          : "${CRON_SECRET:?CRON_SECRET secret is not set}"

          # Do not follow redirects. Vercel Deployment Protection answers
          # unauthenticated requests with a 302 to its SSO page, and curl
          # treats 3xx as success. Check the status explicitly instead.
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          if ! status="$(curl -sS -o "$response" -w '%{http_code}' \
               --retry 3 --retry-delay 30 --retry-all-errors \
               --max-time 300 \
               -X POST "${APP_BASE_URL%/}/api/daily-summary" \
               -H "Authorization: Bearer ${CRON_SECRET}")"; then
            echo "Request failed before receiving an HTTP response"
            cat "$response" || true
            exit 1
          fi

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Request failed with HTTP ${status}"
            cat "$response" || true
            exit 1
          fi

          cat "$response"
